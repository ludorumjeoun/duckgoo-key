name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example, v0.1.0)"
        required: true
        type: string
      publish_r2:
        description: "Publish immutable assets and latest.json to Cloudflare R2"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.7.13"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      pub_date: ${{ steps.release.outputs.pub_date }}
      publish_requested: ${{ steps.release.outputs.publish_requested }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 1

      - name: Install pinned tools
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: python

      - name: Validate tag and Cargo version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_r2 }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a SemVer tag beginning with v (for example, v0.1.0)."
            exit 1
          fi

          version="$(
            python3 - <<'PY'
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(cargo["package"]["version"])
          PY
          )"

          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match Cargo.toml package version $version."
            exit 1
          fi

          tag_date="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$tag")"
          if [[ -n "$tag_date" ]]; then
            release_date="$tag_date"
          else
            release_date="$(git show -s --format=%cI HEAD)"
          fi
          pub_date="$(
            python3 - "$release_date" <<'PY'
          from datetime import datetime, timezone
          import sys

          value = sys.argv[1]
          if value.endswith("Z"):
              value = value[:-1] + "+00:00"
          parsed = datetime.fromisoformat(value).astimezone(timezone.utc)
          print(parsed.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )"

          publish_requested="false"
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            publish_requested="true"
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'pub_date=%s\n' "$pub_date"
            printf 'publish_requested=%s\n' "$publish_requested"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### DuckGooKey release"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Version: \`$version\`"
            echo "- Publication date: \`$pub_date\`"
            echo "- R2 requested: \`$publish_requested\`"
            if [[ "$EVENT_NAME" == "push" ]]; then
              echo "- Tag push policy: build and verify only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Install pinned tools
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: rust cargo:cargo-packager jq

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve public release policy
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REQUESTED: ${{ needs.prepare.outputs.publish_requested }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          signing_count=0
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY"; do
            [[ -z "$value" ]] || signing_count=$((signing_count + 1))
          done
          notarization_count=0
          for value in "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            [[ -z "$value" ]] || notarization_count=$((notarization_count + 1))
          done

          if (( signing_count != 0 && signing_count != 3 )); then
            echo "::error::Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY together."
            exit 1
          fi
          if (( notarization_count != 0 && notarization_count != 3 )); then
            echo "::error::Configure APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID together."
            exit 1
          fi

          public_required="false"
          if [[ "$EVENT_NAME" == "push" || "$PUBLISH_REQUESTED" == "true" ]]; then
            public_required="true"
          fi

          if (( signing_count == 3 && notarization_count == 3 )); then
            if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
              echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
              exit 1
            fi
            distribution="public-notarized"
            artifact_label="public-notarized"
          elif (( signing_count == 0 && notarization_count == 0 )); then
            if [[ "$public_required" == "true" ]]; then
              echo "::error::Tag builds and R2 publication require Developer ID signing and Apple notarization."
              exit 1
            fi
            distribution="unsigned-diagnostic"
            artifact_label="UNSIGNED-NOT-FOR-DISTRIBUTION"
            echo "::notice::Building unsigned diagnostics because this manual run disabled R2 and has no Apple secrets."
          else
            echo "::error::Developer ID signing and Apple notarization must be configured together."
            exit 1
          fi

          {
            printf 'distribution=%s\n' "$distribution"
            printf 'artifact_label=%s\n' "$artifact_label"
          } >> "$GITHUB_OUTPUT"

      - name: Package and verify release assets
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          DISTRIBUTION: ${{ steps.policy.outputs.distribution }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/duckgookey-release/$PLATFORM"
          mkdir -p "$release_dir"

          args=(
            --distribution "$DISTRIBUTION"
            --version "$VERSION"
            --platform "$PLATFORM"
            --stage-dir "$release_dir"
          )
          if [[ "$DISTRIBUTION" == "public-notarized" ]]; then
            args+=(
              --signing-source p12-env
              --notary-auth apple-id
            )
          fi

          ./scripts/package-macos-release-arch.sh "${args[@]}"
          printf 'release_dir=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DuckGooKey-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ steps.policy.outputs.artifact_label }}
          path: ${{ steps.package.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 30

  publish-r2:
    name: Publish to Cloudflare R2
    if: needs.prepare.outputs.publish_requested == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Install pinned tools
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: python jq aws

      - name: Check R2 publishing configuration
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$R2_ACCESS_KEY_ID" ]] || missing+=("CLOUDFLARE_R2_ACCESS_KEY_ID secret")
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || missing+=("CLOUDFLARE_R2_SECRET_ACCESS_KEY secret")
          [[ -n "$R2_BUCKET" ]] || missing+=("CLOUDFLARE_R2_BUCKET variable")
          [[ -n "$R2_ENDPOINT" ]] || missing+=("CLOUDFLARE_R2_ENDPOINT variable")
          [[ -n "$R2_PUBLIC_BASE_URL" ]] || missing+=("CLOUDFLARE_R2_PUBLIC_BASE_URL variable")

          if (( ${#missing[@]} > 0 )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error::R2 publishing is missing ${missing_list%, }."
            exit 1
          fi

      - name: Download public architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: DuckGooKey-${{ needs.prepare.outputs.version }}-macos-*-public-notarized
          path: release-assets
          merge-multiple: true

      - name: Build latest release manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUB_DATE: ${{ needs.prepare.outputs.pub_date }}
          R2_PUBLIC_BASE_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          ./scripts/build-release-manifest.sh \
            --version "$VERSION" \
            --pub-date "$PUB_DATE" \
            --base-url "$R2_PUBLIC_BASE_URL" \
            --artifacts-dir "$GITHUB_WORKSPACE/release-assets" \
            --output "$GITHUB_WORKSPACE/release-assets/latest.json"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: DuckGooKey-${{ needs.prepare.outputs.version }}-release-manifest
          path: release-assets/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and verify through the public CDN
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          VERSION: ${{ needs.prepare.outputs.version }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          ./scripts/publish-r2.sh \
            --version "$VERSION" \
            --bucket "$R2_BUCKET" \
            --endpoint "$R2_ENDPOINT" \
            --base-url "$R2_PUBLIC_BASE_URL" \
            --artifacts-dir "$GITHUB_WORKSPACE/release-assets" \
            --manifest "$GITHUB_WORKSPACE/release-assets/latest.json"
